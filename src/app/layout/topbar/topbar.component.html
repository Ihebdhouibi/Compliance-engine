<header class="topbar">
  <div class="topbar__left">
    <div class="topbar__tag">
      <span class="dot"></span>
      <span>{{ platformTitle }}</span>
    </div>
  </div>

  <div class="topbar__right">

    <!-- Notifications -->
    <div class="topbar__notif-wrap">
      <button class="topbar__icon-btn" (click)="toggleNotif()" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          style="width:17px;height:17px;display:block;">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
        <span class="notif-badge" *ngIf="unread > 0">{{ unread }}</span>
      </button>

      <div class="notif-panel" *ngIf="showNotif">
        <div class="notif-panel__head">
          <span>Notifications</span>
          <button (click)="markRead()">Mark all read</button>
        </div>
        <div class="notif-panel__empty" *ngIf="notifications.length === 0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
            style="width:32px;height:32px;margin:0 auto 10px;display:block;">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <p>No notifications</p>
        </div>
        <div class="notif-panel__item" *ngFor="let n of notifications" [class.unread]="!n.read">
          <div class="n-dot"></div>
          <div class="n-body">
            <p>{{ n.message }}</p>
            <span>{{ n.time }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- User info -->
    <div class="topbar__user">

      <!-- Avatar: shows initials always, image only if server profile exists -->
      <div class="topbar__avatar" [title]="userName">
        <img *ngIf="profileImageUrl" [src]="profileImageUrl" [alt]="userName"
          style="width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;" />
        <span class="topbar__initials" *ngIf="!profileImageUrl">
          {{ initials }}
        </span>
      </div>

      <div class="topbar__user-info">
        <span class="u-name">{{ userName }}</span>
        <span class="u-role">{{ roleLabel }}</span>
      </div>
    </div>

    <!-- Logout -->
    <button class="topbar__logout" (click)="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        style="width:15px;height:15px;flex-shrink:0;display:block;">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      <span>Sign Out</span>
    </button>

  </div>
</header>
