<div class="sb-overlay" [class.visible]="mobileOpen()" (click)="closeAll()"></div>

<button class="sb-hamburger" (click)="toggleMobile()" aria-label="Open menu">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
    <line x1="3" y1="6" x2="21" y2="6" />
    <line x1="3" y1="12" x2="21" y2="12" />
    <line x1="3" y1="18" x2="21" y2="18" />
  </svg>
</button>

<aside class="sidebar" [class.sidebar--collapsed]="collapsed()" [class.sidebar--open]="mobileOpen()">

  <!-- Logo row -->
  <!-- Logo row -->
  <div class="sidebar__head">

    <!-- If custom logo uploaded: show it -->
    <div class="sidebar__logo-icon" *ngIf="!logoUrl">
      <svg viewBox="0 0 24 24" fill="none" stroke="#00d4ed" stroke-width="1.5" width="18" height="18">
        <path d="M12 2L4 6V12C4 16.418 7.582 20 12 22C16.418 20 20 16.418 20 12V6L12 2Z" stroke-linejoin="round" />
        <path d="M9 12L11 14L15 10" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>

    <div class="sidebar__logo-img" *ngIf="logoUrl">
      <img [src]="logoUrl" [alt]="projectTitle" style="width:34px;height:34px;object-fit:contain;border-radius:9px;" />
    </div>

    <div class="sidebar__brand" [class.hide]="collapsed()">
      <span class="brand-name">{{ projectTitle }}</span>
      <span class="brand-tag">Compliance Platform</span>
    </div>
  </div>

  <!-- Role badge -->
  <div class="sidebar__badge" [class.badge--icon]="collapsed()">
    <span class="badge-pulse"></span>
    <span class="badge-text" [class.hide]="collapsed()">{{ roleBadge }}</span>
  </div>

  <!-- Nav -->
  <nav class="sidebar__nav">
    <span class="nav-section-label" [class.hide]="collapsed()">Navigation</span>

    <a *ngFor="let item of navItems()" class="nav-item" [class.nav-item--icon-only]="collapsed()"
      [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
      [title]="item.label" (click)="closeAll()">

      <span class="nav-item__icon">
        <ng-container [ngSwitch]="item.iconKey">
          <svg *ngSwitchCase="'grid'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18"
            height="18">
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
          </svg>
          <svg *ngSwitchCase="'users'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18"
            height="18">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          <svg *ngSwitchCase="'user'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18"
            height="18">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <svg *ngSwitchCase="'clipboard'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            width="18" height="18">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
            <rect x="8" y="2" width="8" height="4" rx="1" />
            <line x1="9" y1="12" x2="15" y2="12" />
            <line x1="9" y1="16" x2="12" y2="16" />
          </svg>
          <svg *ngSwitchCase="'file'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18"
            height="18">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="9" y1="13" x2="15" y2="13" />
            <line x1="9" y1="17" x2="12" y2="17" />
          </svg>
          <svg *ngSwitchCase="'settings'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            width="18" height="18">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83" />
          </svg>
          <svg *ngSwitchCase="'profile'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            width="18" height="18">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <svg *ngSwitchCase="'builder'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            width="18" height="18">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
          </svg>
        </ng-container>
      </span>

      <span class="nav-item__label" [class.hide]="collapsed()">{{ item.label }}</span>
      <span class="nav-item__bar" *ngIf="!collapsed()"></span>
    </a>
  </nav>

  <div class="sidebar__footer" [class.hide]="collapsed()">
    v1.0.0 · AI Audit System
  </div>
</aside>
