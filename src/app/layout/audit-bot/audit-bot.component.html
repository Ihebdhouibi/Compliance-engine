<div class="bot-panel">

  <div class="bot-head">
    <div class="bot-head__title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           width="16" height="16" style="display:block;">
        <rect x="3" y="11" width="18" height="10" rx="2"/>
        <path d="M9 11V7a3 3 0 0 1 6 0v4"/>
        <circle cx="12" cy="16" r="1" fill="currentColor"/>
      </svg>
      AI Audit Assistant
    </div>
    <button class="bot-close" (click)="close()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           width="14" height="14" style="display:block;">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- ★ #messagesContainer ref for scroll targeting -->
  <div class="bot-messages" #messagesContainer>

    <div class="bot-empty" *ngIf="messages.length === 0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           width="36" height="36" style="display:block;margin:0 auto 12px;opacity:.25">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>Ask me anything about this audit.</p>
      <p class="bot-empty__sub">
        I can help analyze data, check compliance rules,
        identify risks, or suggest decisions.
      </p>
    </div>

    <div *ngFor="let m of messages"
         class="bot-msg"
         [class.bot-msg--user]="m.role === 'user'"
         [class.bot-msg--bot]="m.role === 'bot'">
      <div class="bot-msg__avatar" *ngIf="m.role === 'bot'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             width="12" height="12">
          <rect x="3" y="11" width="18" height="10" rx="2"/>
          <path d="M9 11V7a3 3 0 0 1 6 0v4"/>
        </svg>
      </div>
      <div class="bot-msg__bubble">
        <pre>{{ m.text }}</pre>
      </div>
      <div class="bot-msg__time">{{ m.time | date:'HH:mm' }}</div>
    </div>

    <div class="bot-thinking" *ngIf="isThinking">
      <span></span><span></span><span></span>
    </div>

  </div>

  <div class="bot-input">
    <textarea
      [(ngModel)]="inputText"
      (keydown)="onKey($event)"
      placeholder="Ask about this audit… (Enter to send)"
      rows="2">
    </textarea>
    <button class="bot-send"
            (click)="send()"
            [disabled]="!inputText.trim() || isThinking">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           width="16" height="16" style="display:block;">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

</div>
