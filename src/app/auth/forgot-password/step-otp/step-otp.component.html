<div class="auth-bg">
  <div class="auth-bg__grid"></div>
  <div class="auth-bg__scanline"></div>

  <svg class="auth-bg__canvas" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice"
    xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="og1" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#00d4ed" stop-opacity=".9" />
        <stop offset="100%" stop-color="#00d4ed" stop-opacity="0" />
      </radialGradient>
    </defs>
    <g stroke="rgba(0,212,237,.14)" stroke-width=".8" fill="none">
      <line x1="150" y1="300" x2="450" y2="180" class="neural-edge" />
      <line x1="450" y1="180" x2="750" y2="320" class="neural-edge" style="animation-delay:.4s" />
      <line x1="750" y1="320" x2="1050" y2="200" class="neural-edge" style="animation-delay:.8s" />
      <line x1="150" y1="300" x2="300" y2="650" class="neural-edge" style="animation-delay:.6s" />
      <line x1="300" y1="650" x2="650" y2="700" class="neural-edge" style="animation-delay:1s" />
      <line x1="650" y1="700" x2="980" y2="580" class="neural-edge" style="animation-delay:.2s" />
    </g>
    <g fill="url(#og1)">
      <circle class="neural-node" cx="150" cy="300" r="5" />
      <circle class="neural-node" cx="450" cy="180" r="4" style="animation-delay:.4s" />
      <circle class="neural-node" cx="750" cy="320" r="6" style="animation-delay:.8s" />
      <circle class="neural-node" cx="1050" cy="200" r="4" style="animation-delay:.6s" />
      <circle class="neural-node" cx="300" cy="650" r="3" style="animation-delay:1s" />
      <circle class="neural-node" cx="650" cy="700" r="5" style="animation-delay:.2s" />
      <circle class="neural-node" cx="980" cy="580" r="4" style="animation-delay:.7s" />
    </g>
  </svg>

  <div class="auth-bg__content">
    <div class="auth-card">
      <span class="auth-card__corner auth-card__corner--tl"></span>
      <span class="auth-card__corner auth-card__corner--tr"></span>
      <span class="auth-card__corner auth-card__corner--bl"></span>
      <span class="auth-card__corner auth-card__corner--br"></span>

      <!-- Brand -->
      <div class="auth-brand a1">
        <div class="auth-brand__icon" *ngIf="!logoUrl">
          <svg viewBox="0 0 24 24" fill="none" stroke="#00d4ed" stroke-width="1.5" width="20" height="20"
            style="display:block;">
            <path d="M12 2L4 6V12C4 16.418 7.582 20 12 22C16.418 20 20 16.418 20 12V6L12 2Z" stroke-linejoin="round" />
            <path d="M9 12L11 14L15 10" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="auth-brand__icon" *ngIf="logoUrl">
          <img [src]="logoUrl" [alt]="platformTitle"
            style="width:20px;height:20px;object-fit:contain;border-radius:4px;display:block;" />
        </div>
        <div class="auth-brand__text">
          <span class="name">{{ platformTitle }}</span>
          <span class="sub">Compliance Platform</span>
        </div>
      </div>

      <!-- Stepper -->
      <div class="auth-steps a2">
        <div class="step done">
          <div class="dot"></div>
          <span class="step-label">Email</span>
        </div>
        <div class="step active">
          <div class="dot"></div>
          <span class="step-label">Verify</span>
        </div>
        <div class="step">
          <div class="dot"></div>
          <span class="step-label">Reset</span>
        </div>
      </div>

      <!-- Icon badge -->
      <div class="fp-icon a3">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="24" height="24"
          style="display:block;">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>

      <!-- Heading -->
      <div class="auth-heading a4">
        <h2>Verify Your Identity</h2>
        <p>Enter the 4-digit code sent to
          <strong class="otp-email">{{ maskedEmail }}</strong>
        </p>
      </div>

      <!-- Timer -->
      <div class="otp-timer a5" *ngIf="!isExpired">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          style="width:16px;height:16px;flex-shrink:0;display:block;">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
        <span>Code expires in</span>
        <span class="otp-timer__val" [class.warn]="timerClass === 'warning'" [class.danger]="timerClass === 'danger'">
          {{ timerDisplay }}
        </span>
      </div>

      <!-- Error -->
      <div class="auth-alert auth-alert--error a5" *ngIf="errorMessage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          style="width:16px;height:16px;flex-shrink:0;display:block;">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <p>{{ errorMessage }}</p>
      </div>

      <!-- OTP inputs -->
      <ng-container *ngIf="!isExpired; else expTpl">

        <div class="otp-group a6">
          <input #otpInput class="otp-box" type="text" inputmode="numeric" maxlength="1" placeholder="·"
            autocomplete="off" spellcheck="false" (keydown)="onKeyDown($event, 0)" (input)="onInput($event, 0)"
            (focus)="onFocus($event)" />
          <input #otpInput class="otp-box" type="text" inputmode="numeric" maxlength="1" placeholder="·"
            autocomplete="off" spellcheck="false" (keydown)="onKeyDown($event, 1)" (input)="onInput($event, 1)"
            (focus)="onFocus($event)" />
          <input #otpInput class="otp-box" type="text" inputmode="numeric" maxlength="1" placeholder="·"
            autocomplete="off" spellcheck="false" (keydown)="onKeyDown($event, 2)" (input)="onInput($event, 2)"
            (focus)="onFocus($event)" />
          <input #otpInput class="otp-box" type="text" inputmode="numeric" maxlength="1" placeholder="·"
            autocomplete="off" spellcheck="false" (keydown)="onKeyDown($event, 3)" (input)="onInput($event, 3)"
            (focus)="onFocus($event)" />
        </div>

        <button class="auth-submit a7" [disabled]="isLoading || !isComplete" (click)="onSubmit()">
          <span class="btn-spinner" *ngIf="isLoading"></span>
          <span>{{ isLoading ? 'Verifying…' : 'Verify Code' }}</span>
          <svg *ngIf="!isLoading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            style="width:16px;height:16px;flex-shrink:0;display:block;">
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>

        <div class="otp-resend a8">
          <span>Didn't receive it? </span>
          <button type="button" (click)="resendCode()" [disabled]="resendCooldown > 0">
            {{ resendCooldown > 0 ? 'Resend in ' + resendCooldown + 's' : 'Resend Code' }}
          </button>
        </div>

      </ng-container>

      <ng-template #expTpl>
        <div class="otp-expired a6">
          <p>Your verification code has expired.</p>
          <button class="auth-submit" (click)="resendCode()">Send New Code</button>
        </div>
      </ng-template>

      <div class="auth-link a9">
        <p><a routerLink="/auth/forgot-password">← Change email</a></p>
      </div>

    </div>
  </div>
</div>
