<div class="login-page">

  <!-- Animated background -->
  <div class="login-page__bg">
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow--1"></div>
    <div class="bg-glow bg-glow--2"></div>
    <div class="bg-scanline"></div>

    <svg class="bg-network" viewBox="0 0 1200 700"
         preserveAspectRatio="xMidYMid slice"
         xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="nd" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#00d4ed" stop-opacity=".8"/>
          <stop offset="100%" stop-color="#00d4ed" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g stroke="rgba(0,212,237,.13)" stroke-width=".8" fill="none">
        <line x1="100" y1="150" x2="320" y2="260" class="net-edge"/>
        <line x1="320" y1="260" x2="560" y2="160" class="net-edge" style="animation-delay:.5s"/>
        <line x1="560" y1="160" x2="820" y2="300" class="net-edge" style="animation-delay:1s"/>
        <line x1="820" y1="300" x2="1060" y2="180" class="net-edge" style="animation-delay:.3s"/>
        <line x1="100" y1="150" x2="220" y2="480" class="net-edge" style="animation-delay:.8s"/>
        <line x1="220" y1="480" x2="540" y2="530" class="net-edge" style="animation-delay:.2s"/>
        <line x1="540" y1="530" x2="820" y2="300" class="net-edge" style="animation-delay:1.2s"/>
        <line x1="540" y1="530" x2="800" y2="580" class="net-edge" style="animation-delay:.6s"/>
        <line x1="800" y1="580" x2="1060" y2="480" class="net-edge" style="animation-delay:.9s"/>
      </g>
      <g fill="url(#nd)">
        <circle class="net-node" cx="100"  cy="150" r="5"/>
        <circle class="net-node" cx="320"  cy="260" r="4" style="animation-delay:.5s"/>
        <circle class="net-node" cx="560"  cy="160" r="6" style="animation-delay:1s"/>
        <circle class="net-node" cx="820"  cy="300" r="5" style="animation-delay:.3s"/>
        <circle class="net-node" cx="1060" cy="180" r="4" style="animation-delay:.8s"/>
        <circle class="net-node" cx="220"  cy="480" r="4" style="animation-delay:.2s"/>
        <circle class="net-node" cx="540"  cy="530" r="5" style="animation-delay:1.2s"/>
        <circle class="net-node" cx="800"  cy="580" r="3" style="animation-delay:.6s"/>
        <circle class="net-node" cx="1060" cy="480" r="4" style="animation-delay:.9s"/>
      </g>
    </svg>
  </div>

  <!-- Centered card -->
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-card__accent"></div>

      <!-- Brand -->
      <div class="login-brand">
        <div class="login-brand__shield" *ngIf="!logoUrl">
          <svg viewBox="0 0 24 24" fill="none" stroke="#00d4ed" stroke-width="1.5"
               width="20" height="20" style="display:block;">
            <path d="M12 2L4 6V12C4 16.418 7.582 20 12 22C16.418 20 20 16.418 20 12V6L12 2Z"
                  stroke-linejoin="round"/>
            <path d="M9 12L11 14L15 10" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="login-brand__shield" *ngIf="logoUrl">
          <img [src]="logoUrl" [alt]="platformTitle"
               style="width:20px;height:20px;object-fit:contain;border-radius:4px;display:block;"/>
        </div>
        <div class="login-brand__text">
          <span class="login-brand__name">{{ platformTitle }}</span>
          <span class="login-brand__tag">Compliance Platform</span>
        </div>
      </div>

      <!-- Heading -->
      <div class="login-heading">
        <h1>Welcome back</h1>
        <p>Sign in to continue to your workspace</p>
      </div>

      <!-- Error alert -->
      <div class="form-alert form-alert--error" *ngIf="errorMessage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             style="width:16px;height:16px;flex-shrink:0;display:block;">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8"  x2="12"   y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Form -->
      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="login-form">

        <!-- Email -->
        <div class="form-field">
          <label class="form-field__label">Email Address</label>
          <div class="form-field__control">
            <svg class="form-field__icon" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 style="width:17px;height:17px;display:block;">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="m2 7 10 7 10-7"/>
            </svg>
            <input
              type="email"
              formControlName="username"
              placeholder="you@company.com"
              autocomplete="email"
              [class.invalid]="fc['username'].invalid && fc['username'].touched"
            />
          </div>
          <span class="form-field__error"
                *ngIf="fc['username'].invalid && fc['username'].touched">
            <span *ngIf="fc['username'].errors?.['required']">Email is required</span>
            <span *ngIf="fc['username'].errors?.['email']">Enter a valid email address</span>
          </span>
        </div>

        <!-- Password -->
        <div class="form-field">
          <div class="form-field__label-row">
            <label class="form-field__label">Password</label>
            <a class="form-field__link" routerLink="/auth/forgot-password">
              Forgot password?
            </a>
          </div>
          <div class="form-field__control">
            <svg class="form-field__icon" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 style="width:17px;height:17px;display:block;">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              [type]="showPw ? 'text' : 'password'"
              formControlName="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              [class.invalid]="fc['password'].invalid && fc['password'].touched"
            />
            <button type="button" class="form-field__toggle" (click)="showPw = !showPw">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   style="width:17px;height:17px;display:block;">
                <ng-container *ngIf="!showPw">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </ng-container>
                <ng-container *ngIf="showPw">
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                  <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                  <line x1="2" y1="2" x2="22" y2="22"/>
                </ng-container>
              </svg>
            </button>
          </div>
          <span class="form-field__error"
                *ngIf="fc['password'].invalid && fc['password'].touched">
            Password is required
          </span>
        </div>

        <!-- Submit -->
        <button type="submit" class="login-btn" [disabled]="isLoading">
          <span class="spinner" *ngIf="isLoading"></span>
          <span>{{ isLoading ? 'Signing in…' : 'Sign In' }}</span>
          <svg *ngIf="!isLoading" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5"
               style="width:16px;height:16px;flex-shrink:0;display:block;">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>

      </form>

      <!-- Footer -->
      <div class="login-footer">
        <span>Don't have an account?</span>
        <a routerLink="/auth/sign-up">Create account</a>
      </div>

    </div>

    <!-- Trust badges -->
    <div class="login-badges">
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             style="width:13px;height:13px;display:block;">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span>256-bit SSL</span>
      </div>
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             style="width:13px;height:13px;display:block;">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>ISO 27001</span>
      </div>
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             style="width:13px;height:13px;display:block;">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span>GDPR Compliant</span>
      </div>
    </div>

  </div>
</div>
