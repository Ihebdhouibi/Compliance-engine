spring:
  application:
    name: AiAuditServer
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/audit?createDatabaseIfNotExist=true
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  devtools:
    restart:
      enabled: true
  main:
    allow-bean-definition-overriding: true
  security:
    headers:
      frame: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ch.marwen5000@gmail.com
    password: hjrpkddllyfukxxy
    protocol: smtp
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
    # Use this to trust Gmail's servers specifically
      mail.smtp.ssl.trust: smtp.gmail.com
  servlet:
    multipart:
      enabled: true
      max-file-size: 10000MB
      max-request-size: 10000MB
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        default_schema: public
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  flyway:
    enabled: false

server:
  port: ${PORT:8080}
  error:
    include-message: always

ocr:
  base-url: ${OCR_BASE_URL:http://localhost:8000}
  upload-root: ${OCR_UPLOAD_ROOT:WebContent}
  callback-secret: ${OCR_CALLBACK_SECRET:dev-ocr-shared-secret-change-me}
  servlet:
    encoding:
      charset: UTF-8
      force: true
auth:
  jwtExpirationMs: 86400000
  jwtRefreshExpirationMs: 86400000
